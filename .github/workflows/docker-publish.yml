name: Build and Push Docker Image

on:
  push:
    branches: [ "dev" ] # 푸시할 때 자동 실행될 브랜치

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR에 이미지를 올리기 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 설정 없이 기본 제공됨

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 본인의 깃허브 아이디나 조직 이름으로 자동 태깅됨 (모두 소문자)
          tags: ghcr.io/modakstudio/plus_bot:latest